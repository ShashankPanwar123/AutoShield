# ================================================================
# AutoShield — Render Deployment Config
# ================================================================

services:
  # ---- FastAPI Backend ----
  - type: web
    name: autoshield-api
    runtime: python
    buildCommand: pip install -r requirements-backend.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
    healthCheckPath: /health
    autoDeploy: true

